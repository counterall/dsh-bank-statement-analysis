# Bundle patch layer: the row loads lib/index.js as the host half (statements
# folder, the `spendingInsights` Remote service and the agent tools); the
# `dsh.client` declaration in package.json makes the web app load
# lib/client.js as the browser half, which adds the sidebar entry and panel.
- insert:
    - id: dsh-spending-insights
      name: dsh-spending-insights
